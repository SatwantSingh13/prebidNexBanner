<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NexBid Prebid Test</title>
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
  <!-- Build Prebid.js with nexbidBidAdapter and serve the resulting bundle here. -->
  <script async src="/build/dev/prebid.js"></script>
</head>
<body>
  <div id="nexbid-test-300x250" style="width:300px;height:250px"></div>

  <script>
    window.googletag = window.googletag || { cmd: [] };
    window.pbjs = window.pbjs || { que: [] };

    googletag.cmd.push(function () {
      googletag.defineSlot('/1234567/nexbid_prebid_test', [300, 250], 'nexbid-test-300x250')
        .addService(googletag.pubads());
      googletag.pubads().disableInitialLoad();
      googletag.enableServices();
    });

    pbjs.que.push(function () {
      pbjs.addAdUnits([{
        code: 'nexbid-test-300x250',
        mediaTypes: {
          banner: { sizes: [[300, 250]] }
        },
        bids: [{
          bidder: 'nexbid',
          params: {
            publisherId: 'nexbid-test',
            placementId: 'banner-300x250',
            configId: 'prebid-review',
            test: true
          }
        }]
      }]);

      pbjs.requestBids({
        timeout: 1200,
        bidsBackHandler: function () {
          pbjs.setTargetingForGPTAsync(['nexbid-test-300x250']);
          googletag.cmd.push(function () {
            googletag.pubads().refresh();
          });
        }
      });
    });
  </script>
</body>
</html>
