<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NexBid Prebid Example</title>
  <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
  <script async src="https://cdn.jsdelivr.net/npm/prebid.js@latest/dist/prebid.js"></script>
</head>
<body>
  <div id="moneycontrol_300x250" style="width:300px;height:250px"></div>

  <script>
    window.googletag = window.googletag || { cmd: [] };
    window.pbjs = window.pbjs || {};
    pbjs.que = pbjs.que || [];

    googletag.cmd.push(function () {
      googletag.defineSlot('/23356218010/Moneycontrol_Banner_300', [300, 250], 'moneycontrol_300x250')
        .addService(googletag.pubads());
      googletag.pubads().disableInitialLoad();
      googletag.enableServices();
    });

    pbjs.que.push(function () {
      pbjs.addAdUnits([{
        code: 'moneycontrol_300x250',
        mediaTypes: {
          banner: {
            sizes: [[300, 250]]
          }
        },
        bids: [{
          bidder: 'nexbid',
          params: {
            publisherId: '2606001',
            publisherDomain: 'moneycontrol.com',
            placementId: 'moneycontrol_300x250',
            configId: 'moneycontrol.com-version-2-testing',
            floorCpm: '0.15',
            endpoint: 'https://nexbid.uk/api/v1/prebid/bid'
          }
        }]
      }]);

      pbjs.requestBids({
        bidsBackHandler: function () {
          pbjs.setTargetingForGPTAsync(['moneycontrol_300x250']);
          googletag.cmd.push(function () {
            googletag.pubads().refresh();
          });
        }
      });
    });
  </script>
</body>
</html>
